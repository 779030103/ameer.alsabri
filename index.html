<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المهندس أمير الدين الصبري | هبر ومركز العمليات السيبراني</title>
    <!-- استدعاء ملف الستايل -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- غلاف الخلفية وتأثيرات التشويش -->
    <div class="glitch-overlay"></div>

    <!-- رأس الصفحة ونظام التنقل -->
    <header class="cyber-header">
        <div class="logo">AMEER.SYS // 2026</div>
        <nav class="cyber-nav">
            <ul>
                <li class="os-nav-item active" data-target="home"><i class="fas fa-home"></i> الرئيسية</li>
                <li class="os-nav-item" data-target="ops-center"><i class="fas fa-chart-line"></i> غرفة العمليات</li>
                <li class="os-nav-item" data-target="projects"><i class="fas fa-code"></i> المشاريع</li>
                <li class="os-nav-item" data-target="lab"><i class="fas fa-flask"></i> المختبر</li>
            </ul>
        </nav>
        <div class="header-status">
            <span id="live-clock">00:00:00</span> | <span style="color: #00ff88;">ONLINE</span>
        </div>
    </header>

    <!-- المحتوى الرئيسي (سيتم حقن الأقسام ديناميكياً بواسطة الجافاسكريبت) -->
    <main class="main-container">
        <section id="home" class="tab-content active"></section>
        <section id="ops-center" class="tab-content"></section>
        <section id="projects" class="tab-content"></section>
        <section id="lab" class="tab-content"></section>
    </main>

    <!-- استدعاء ملف السكريبت المطور -->
    <script src="script.js"></script>
</body>
</html>
